<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04050b" />
  <title>REAL Shahnameh — Wallet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <link rel="stylesheet" href="style.css?v=202606051030" />
</head>
<body>
<main class="app">

  <section class="page-head">
    <button class="back-btn" id="back-btn" onclick="history.length > 1 ? history.back() : location.href='index.html'" aria-label="Back" data-i18n="wallet_back">
      ← Back
    </button>
  </section>

  <section class="page-head" style="margin-top:0;">
    <div>
      <h2 class="page-title" data-i18n="wallet_page_title">Connect TON Wallet</h2>
      <p class="page-sub" data-i18n="wallet_page_sub">Link your wallet to verify REAL holdings and unlock airdrop eligibility.</p>
    </div>
  </section>

  <article class="card gold-edge" style="padding:20px 18px; margin-top:4px;">
    <div data-wallet-block></div>
  </article>

</main>

<style>
  /* Wallet block (shared styling, also used to exist in hakim.html) */
  .wallet-block { border:1px solid rgba(244,197,107,.2); border-radius:12px; padding:14px 16px; }
  .wallet-block.verified { border-color:rgba(80,220,160,.4); background:rgba(80,220,160,.05); }
  .wallet-block.elite { border-color:rgba(244,197,107,.5); background:rgba(244,197,107,.08); box-shadow:0 0 20px rgba(244,197,107,.15); }
  .wallet-tier-badge { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-top:8px; }
  .tier-legend  { background:rgba(244,197,107,.2); color:var(--gold); border:1px solid rgba(244,197,107,.4); }
  .tier-elite   { background:rgba(244,197,107,.15); color:var(--gold); border:1px solid rgba(244,197,107,.3); }
  .tier-holder  { background:rgba(80,220,160,.1); color:#50dca0; border:1px solid rgba(80,220,160,.3); }
  .tier-supporter { background:rgba(255,255,255,.05); color:var(--text-muted); border:1px solid rgba(255,255,255,.1); }
  /* TON Connect button */
  #ton-connect-btn { margin-top:10px; }
  #ton-connect-btn button { width:100%; }
  tc-root { --tc-font-family: inherit; }
  .ton-connect-button { width:100% !important; }
</style>

<div class="toast" data-toast></div>

</body>
</html>
