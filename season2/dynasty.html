<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04050b" />
  <title>Mythic Lineage · REAL Shahnameh</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=202606060001" />
  <style>
    /* ── Page shell ──────────────────────────────────────────────────────── */
    .dynasty-page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      padding: 0;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    .dy-header {
      flex-shrink: 0;
      padding: 18px 16px 10px;
      text-align: center;
    }
    .dy-kicker {
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .dy-h1 {
      font-size: 22px;
      font-weight: 900;
      margin: 0 0 4px;
      background: linear-gradient(135deg, var(--gold-2) 0%, var(--gold) 60%, #e8a94f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Progress pill */
    .dy-progress {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 16px 0;
      background: rgba(244,197,107,.07);
      border: 1px solid rgba(244,197,107,.18);
      border-radius: 30px;
      padding: 7px 14px;
    }
    .dy-track {
      flex: 1; height: 3px;
      background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden;
    }
    .dy-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-3), var(--gold-2));
      border-radius: 2px;
      transition: width .7s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }
    .dy-label {
      font-size: 11px; font-weight: 700; color: var(--gold); white-space: nowrap;
    }

    /* ── Filter tabs ─────────────────────────────────────────────────────── */
    .dy-filters {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      padding: 10px 14px 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .dy-filters::-webkit-scrollbar { display: none; }
    .dy-ftab {
      flex-shrink: 0;
      font-size: 10.5px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: all .15s;
    }
    .dy-ftab.active {
      background: rgba(244,197,107,.14);
      border-color: rgba(244,197,107,.4);
      color: var(--gold);
    }

    /* ── Canvas viewport ─────────────────────────────────────────────────── */
    #dy-viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
      cursor: grab;
      touch-action: none;
    }
    #dy-viewport.dragging { cursor: grabbing; }
    #dy-canvas {
      position: absolute;
      top: 0; left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }
    #dy-svg {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      overflow: visible;
    }

    /* ── Tree nodes ──────────────────────────────────────────────────────── */
    .tn {
      position: absolute;
      text-align: center;
      user-select: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .2s;
    }
    .tn-ring {
      position: relative;
      margin: 0 auto;
      border-radius: 50%;
      overflow: hidden;
      border: 2.5px solid transparent;
      background: var(--bg-2);
      transition: box-shadow .2s, border-color .2s;
    }
    .tn-ring img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .tn-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(4,5,11,.55);
      font-size: 14px; border-radius: 50%;
    }
    .tn-sdot {
      width: 8px; height: 8px; border-radius: 50%;
      margin: 4px auto 0;
      background: rgba(255,255,255,.15);
    }
    .tn-name {
      font-size: 9.5px; font-weight: 700;
      color: var(--text); margin-top: 3px;
      line-height: 1.2;
      word-break: break-word;
    }
    .tn-sub {
      font-size: 7.5px; color: var(--muted-2);
      line-height: 1.2; margin-top: 1px;
      word-break: break-word;
    }
    .tn-note-badge {
      font-size: 6.5px;
      background: rgba(255,255,255,.07);
      border-radius: 6px;
      padding: 1px 5px;
      color: var(--muted-2);
      margin-top: 2px;
      display: inline-block;
      max-width: 78px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Type-specific ring colors ───────────────────────────────────────── */
    .tn-king .tn-ring      { border-color: rgba(244,197,107,.35); }
    .tn-hero .tn-ring      { border-color: rgba(140,109,255,.4); }
    .tn-prince .tn-ring    { border-color: rgba(78,208,166,.35); }
    .tn-villain .tn-ring   { border-color: rgba(255,82,103,.4); }
    .tn-adventure .tn-ring { border-color: rgba(78,208,166,.25); }

    /* ── Status modifiers ────────────────────────────────────────────────── */
    .tn-completed .tn-ring {
      border-width: 3px;
      box-shadow: 0 0 18px rgba(244,197,107,.4);
    }
    .tn-completed.tn-king .tn-ring    { border-color: var(--gold); box-shadow: 0 0 18px rgba(244,197,107,.4); }
    .tn-completed.tn-hero .tn-ring    { border-color: var(--violet); box-shadow: 0 0 16px rgba(140,109,255,.4); }
    .tn-completed.tn-prince .tn-ring  { border-color: #4ed0a6; box-shadow: 0 0 14px rgba(78,208,166,.35); }
    .tn-completed.tn-villain .tn-ring { border-color: #ff5267; box-shadow: 0 0 14px rgba(255,82,103,.3); }
    .tn-completed .tn-sdot { background: #4ed0a6; }

    .tn-unlocked .tn-sdot { background: var(--gold); }

    .tn-locked { opacity: .62; cursor: pointer; }
    .tn-locked .tn-ring {
      filter: grayscale(1) brightness(.48);
      border-color: rgba(255,255,255,.1) !important;
      box-shadow: none !important;
    }
    .tn-locked .tn-name { color: rgba(255,255,255,.38); }

    .tn-coming_soon { opacity: .5; cursor: default; }
    .tn-coming_soon .tn-ring { filter: grayscale(.8) brightness(.5); }

    .tn-story_only .tn-sdot { background: rgba(255,255,255,.2); }

    /* ── Tree section label ──────────────────────────────────────────────── */
    .dy-tree-label {
      position: absolute;
      font-size: 8.5px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: rgba(244,197,107,.5);
      font-weight: 800;
      white-space: nowrap;
      pointer-events: none;
    }

    /* ── FABs ────────────────────────────────────────────────────────────── */
    .dy-fabs {
      position: absolute;
      bottom: 16px; right: 16px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 10;
    }
    .dy-fab {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(14,19,42,.92);
      border: 1px solid rgba(244,197,107,.3);
      color: var(--gold);
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 16px rgba(0,0,0,.5);
    }
    .dy-fab:active { opacity: .7; }
  </style>
</head>
<body>
<main class="app dynasty-page">

  <div class="dy-header cinematic-enter">
    <div class="dy-kicker" data-i18n="dynasty_kicker">Kingdoms · Bloodlines</div>
    <h1 class="dy-h1" data-i18n="dynasty_title">Mythic Lineage</h1>
    <div class="dy-progress">

<div class="toast" data-toast></div>

<script>
(() => {
  "use strict";

  /* ── i18n helper ──────────────────────────────────────────────────────── */
  const t = (key, fb) => {
    try {
      const l = localStorage.getItem("real_lang") || "en";
      const loc = window.RealI18NLocales;
      return (loc && loc[l] && loc[l][key]) || (loc && loc.en && loc.en[key]) || fb || key;
    } catch { return fb || key; }
  };

  /* ── Toast ────────────────────────────────────────────────────────────── */
  const toastEl = document.querySelector("[data-toast]");
  const toast = (msg) => {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove("show"), 2400);
  };

  /* ── Chapter progress ─────────────────────────────────────────────────── */
  const CHAPTER_SLUGS = [
    "keyumars","hushang","tahmuras","jamshid","zahhak",
    "fereydun","manuchehr","nozar","zal","rudabeh",
    "birth-of-rostam","rostam","sohrab","siavash","kay-kavus",
    "kay-khosrow","akvan","bijan-manijeh","great-war-turan","lohrasp",
    "goshtasp","esfandiyar","seven-labours-esp","clash-rostam-esp","simorgh",
    "rostams-end","bahman","homay","darab","dara",
    "alexander","ashkanian-age","ardavan",
  ];

  const isDone = (slug) => {
    try { return localStorage.getItem("real_chapter_done_" + slug) === "1"; } catch { return false; }
  };

  const figStatus = (node) => {
    if (node.coming_soon) return "coming_soon";
    const slug = node.slug;
    if (!slug) return "story_only";
    if (isDone(slug)) return "completed";
    const idx = CHAPTER_SLUGS.indexOf(slug);
    if (idx < 0) return "locked";
    if (idx <= 1) return "unlocked";
    if (isDone(CHAPTER_SLUGS[idx - 1])) return "unlocked";
    return "locked";
  };

  /* ── Layout constants ─────────────────────────────────────────────────── */
  const NW   = 84;   // normal node slot width
  const NH   = 116;  // normal node slot height (ring + text)
  const AW   = 58;   // adventure node slot width
  const AH   = 88;   // adventure node slot height
  const HGAP = 18;   // horizontal gap between sibling subtrees
  const VGAP = 54;   // vertical gap between parent bottom and child top
  const TGAP = 110;  // gap between separate trees
  const PAD  = 80;   // canvas padding
  const RING = 66;   // normal ring diameter (px)
  const ARING= 44;   // adventure ring diameter

  const IMG = "/season2/uploads/";

  /* ── Subtree metrics ──────────────────────────────────────────────────── */
  const nw = (node) => node.type === "adventure" ? AW : NW;
  const nh = (node) => node.type === "adventure" ? AH : NH;

  function subW(node) {
    if (!node.children?.length) return nw(node);
    const childSum = node.children.reduce((s, c) => s + subW(c), 0);
    const gaps = (node.children.length - 1) * HGAP;
    return Math.max(nw(node), childSum + gaps);
  }

  function assignPos(node, cx, y) {
    node._x = cx;
    node._y = y;
    if (!node.children?.length) return;
    const totalW = node.children.reduce((s, c) => s + subW(c), 0)
                 + (node.children.length - 1) * HGAP;
    let lx = cx - totalW / 2;
    node.children.forEach(child => {
      const cw = subW(child);
      assignPos(child, lx + cw / 2, y + nh(node) + VGAP);
      lx += cw + HGAP;
    });
  }

  function collectNodes(node, arr = []) {
    arr.push(node);
    (node.children || []).forEach(c => collectNodes(c, arr));
    return arr;
  }

  /* ── State ────────────────────────────────────────────────────────────── */
  let allTrees = [];
  let activeFilter = "all";
  let scale = 1.0;
  let offsetX = 0;
  let offsetY = 0;

  const viewport = document.getElementById("dy-viewport");
  const canvas   = document.getElementById("dy-canvas");
  const svg      = document.getElementById("dy-svg");
  const dyFill   = document.getElementById("dy-fill");
  const dyLabel  = document.getElementById("dy-label");

  /* ── Apply transform ──────────────────────────────────────────────────── */
  const applyTransform = () => {
    canvas.style.transform = `translate(${offsetX}px,${offsetY}px) scale(${scale})`;
  };

  /* ── Render ───────────────────────────────────────────────────────────── */
  function render(trees) {
    canvas.querySelectorAll(".tn,.dy-tree-label").forEach(e => e.remove());
    svg.innerHTML = "";

    let curX = PAD;
    const toRender = activeFilter === "all"
      ? trees
      : trees.filter(t => t.id === activeFilter);

    toRender.forEach(tree => {
      const w = subW(tree.root);
      assignPos(tree.root, curX + w / 2, PAD + 24);

      // Tree label
      const lbl = document.createElement("div");
      lbl.className = "dy-tree-label";
      lbl.textContent = tree.label;
      lbl.style.left = (curX) + "px";
      lbl.style.top  = "6px";
      canvas.appendChild(lbl);

      curX += w + TGAP;
    });

    const allNodes = toRender.flatMap(t => collectNodes(t.root));
    const maxX = allNodes.reduce((m, n) => Math.max(m, n._x + NW / 2), 0) + PAD;
    const maxY = allNodes.reduce((m, n) => Math.max(m, n._y + NH), 0) + PAD;

    canvas.style.width  = maxX + "px";
    canvas.style.height = maxY + "px";
    svg.setAttribute("width",  maxX);
    svg.setAttribute("height", maxY);

    // Draw edges first (behind nodes)
    allNodes.forEach(node => {
      (node.children || []).forEach(child => drawEdge(node, child));
    });

    // Draw nodes
    let total = 0, found = 0;
    allNodes.forEach(node => {
      const st = figStatus(node);
      if (node.slug && !node.coming_soon) {
        total++;
        if (st === "completed" || st === "unlocked" || st === "story_only") found++;
      }
      canvas.appendChild(makeNodeEl(node, st));
    });

    const pct = total > 0 ? Math.round(found / total * 100) : 0;
    dyFill.style.width = pct + "%";
    dyLabel.textContent = `${found} / ${total} ${t("dynasty_discovered","discovered")}`;
  }

  /* ── Draw edge SVG path ───────────────────────────────────────────────── */
  function drawEdge(parent, child) {
    const pr = RING / 2;
    const cr = (child.type === "adventure" ? ARING : RING) / 2;
    const x1 = parent._x;
    const y1 = parent._y + nh(parent) - (NH - RING) / 2; // bottom of parent ring area
    const x2 = child._x;
    const y2 = child._y + (child.type === "adventure" ? (AH - ARING) / 2 : (NH - RING) / 2);

    const my = (y1 + y2) / 2;
    const d  = `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`;

    const rel = child.relation || "son";
    let stroke = "rgba(244,197,107,0.2)";
    let dash   = "";

    if (rel === "usurper" || rel === "conqueror") {
      stroke = "rgba(255,82,103,0.4)"; dash = "7,4";
    } else if (rel === "liberator") {
      stroke = "rgba(78,208,166,0.45)"; dash = "8,4";
    } else if (rel === "chosen") {
      stroke = "rgba(244,197,107,0.45)"; dash = "7,5";
    } else if (rel === "companion") {
      stroke = "rgba(140,109,255,0.35)"; dash = "4,4";
    } else if (rel === "adventure") {
      stroke = "rgba(78,208,166,0.25)"; dash = "3,4";
    } else if (rel === "daughter") {
      stroke = "rgba(244,197,107,0.3)";
    } else if (rel === "descendant") {
      stroke = "rgba(244,197,107,0.25)"; dash = "5,5";
    }

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("stroke", stroke);
    path.setAttribute("stroke-width", "1.5");
    path.setAttribute("fill", "none");
    if (dash) path.setAttribute("stroke-dasharray", dash);
    svg.appendChild(path);
  }

  /* ── Build node DOM element ───────────────────────────────────────────── */
  function makeNodeEl(node, status) {
    const isAdv  = node.type === "adventure";
    const ring   = isAdv ? ARING : RING;
    const nwSlot = isAdv ? AW : NW;
    const nhSlot = isAdv ? AH : NH;
    const left   = node._x - nwSlot / 2;

    const el = document.createElement("div");
    el.className = `tn tn-${node.type} tn-${status}`;
    el.style.cssText = `left:${left}px;top:${node._y}px;width:${nwSlot}px`;
    el.setAttribute("data-node-id", node.id);

    const overlayHTML = (status === "coming_soon")
      ? `<div class="tn-overlay" style="font-size:11px">⏳</div>`
      : "";

    const dotHTML = (status !== "locked" && status !== "coming_soon")
      ? `<div class="tn-sdot"></div>` : "";

    const nameText = node.name;
    const subText  = (status !== "locked" && !isAdv) ? (node.title || "") : "";
    const noteText = (status !== "locked" && node.note && !isAdv)
      ? `<div class="tn-note-badge">${node.note}</div>` : "";

    el.innerHTML = `
      <div class="tn-ring" style="width:${ring}px;height:${ring}px">
        <img src="${IMG}${node.img}" alt="${node.name}" loading="lazy" draggable="false"
             onerror="this.style.display='none'">
        ${overlayHTML}
      </div>
      ${dotHTML}
      <div class="tn-name">${nameText}</div>
      ${subText ? `<div class="tn-sub">${subText}</div>` : ""}
      ${noteText}
    `;

    return el;
  }

  /* ── Node tap handler ─────────────────────────────────────────────────── */
  const nodeMap = {};
  function buildNodeMap(trees) {
    trees.forEach(t => collectNodes(t.root).forEach(n => { nodeMap[n.id] = n; }));
  }

  function handleNodeTap(nodeId) {
    const node = nodeMap[nodeId];
    if (!node) return;
    const st = figStatus(node);
    try { navigator.vibrate?.(8); } catch {}

    if (st === "coming_soon") {
      toast(t("dynasty_coming_soon", "Coming soon — this chapter is in the works"));
      return;
    }
    if (st === "story_only") {
      toast(node.note || node.title || node.name);
      return;
    }
    if (st === "locked") {
      const idx = CHAPTER_SLUGS.indexOf(node.slug);
      const chNum = idx >= 0 ? idx + 1 : null;
      const msg = chNum
        ? t("dynasty_locked_ch_toast", `Unlock chapter ${chNum} to meet this character`).replace("{n}", chNum)
        : t("dynasty_locked_toast", "This character is not yet unlocked");
      toast(msg);
      return;
    }
    window.location.href = "chapter.html?slug=" + encodeURIComponent(node.slug);
  }

  /* ── Pan / zoom ───────────────────────────────────────────────────────── */
  let dragging = false, tapCancelled = false;
  let lastX = 0, lastY = 0, tapSX = 0, tapSY = 0, tapT = 0;
  let startDist = 0, startScale = 1, startOX = 0, startOY = 0;

  const MIN_SCALE = 0.22, MAX_SCALE = 2.8;

  const zoomTo = (newScale, pivotX, pivotY) => {
    const clamped = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
    const rect = viewport.getBoundingClientRect();
    const px = (pivotX !== undefined ? pivotX : rect.width  / 2) ;
    const py = (pivotY !== undefined ? pivotY : rect.height / 2);
    offsetX = px - (px - offsetX) * (clamped / scale);
    offsetY = py - (py - offsetY) * (clamped / scale);
    scale = clamped;
    applyTransform();
  };

  const clampOffset = () => {
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    const cw = parseFloat(canvas.style.width  || 0) * scale;
    const ch = parseFloat(canvas.style.height || 0) * scale;
    const minX = Math.min(0, vw - cw - PAD * scale);
    const minY = Math.min(0, vh - ch - PAD * scale);
    offsetX = Math.min(PAD * scale, Math.max(minX, offsetX));
    offsetY = Math.min(PAD * scale, Math.max(minY, offsetY));
  };

  viewport.addEventListener("touchstart", e => {
    if (e.touches.length === 1) {
      dragging = true; tapCancelled = false;
      lastX = tapSX = e.touches[0].clientX;
      lastY = tapSY = e.touches[0].clientY;
      tapT = Date.now();
    } else if (e.touches.length === 2) {
      dragging = false; tapCancelled = true;
      startDist = Math.hypot(
        e.touches[1].clientX - e.touches[0].clientX,
        e.touches[1].clientY - e.touches[0].clientY
      );
      startScale = scale;
      startOX = offsetX; startOY = offsetY;
    }
  }, { passive: true });

  viewport.addEventListener("touchmove", e => {
    e.preventDefault();
    if (e.touches.length === 1 && dragging) {
      const dx = e.touches[0].clientX - lastX;
      const dy = e.touches[0].clientY - lastY;
      if (Math.hypot(dx, dy) > 5) tapCancelled = true;
      offsetX += dx; offsetY += dy;
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      applyTransform();
    } else if (e.touches.length === 2) {
      const dist = Math.hypot(
        e.touches[1].clientX - e.touches[0].clientX,
        e.touches[1].clientY - e.touches[0].clientY
      );
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const rect = viewport.getBoundingClientRect();
      zoomTo(startScale * (dist / startDist), mx - rect.left, my - rect.top);
    }
  }, { passive: false });

  viewport.addEventListener("touchend", e => {
    if (!tapCancelled && e.changedTouches.length === 1 && Date.now() - tapT < 380) {
      const cx = e.changedTouches[0].clientX;
      const cy = e.changedTouches[0].clientY;
      if (Math.hypot(cx - tapSX, cy - tapSY) < 14) {
        const el = document.elementFromPoint(cx, cy)?.closest("[data-node-id]");
        if (el) handleNodeTap(el.dataset.nodeId);
      }
    }
    dragging = false;
  }, { passive: true });

  /* mouse support */
  viewport.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    dragging = true; tapCancelled = false;
    lastX = tapSX = e.clientX; lastY = tapSY = e.clientY;
    tapT = Date.now();
    viewport.classList.add("dragging");
    e.preventDefault();
  });
  document.addEventListener("mousemove", e => {
    if (!dragging) return;
    const dx = e.clientX - lastX; const dy = e.clientY - lastY;
    if (Math.hypot(dx, dy) > 5) tapCancelled = true;
    offsetX += dx; offsetY += dy;
    lastX = e.clientX; lastY = e.clientY;
    applyTransform();
  });
  document.addEventListener("mouseup", e => {
    if (!tapCancelled && dragging && e.button === 0 && Date.now() - tapT < 380) {
      if (Math.hypot(e.clientX - tapSX, e.clientY - tapSY) < 10) {
        const el = document.elementFromPoint(e.clientX, e.clientY)?.closest("[data-node-id]");
        if (el) handleNodeTap(el.dataset.nodeId);
      }
    }
    dragging = false;
    viewport.classList.remove("dragging");
  });
  viewport.addEventListener("wheel", e => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    zoomTo(scale * factor, e.clientX - rect.left, e.clientY - rect.top);
  }, { passive: false });

  /* ── FAB buttons ──────────────────────────────────────────────────────── */
  document.getElementById("dy-zoomin").addEventListener("click", () => zoomTo(scale * 1.3));
  document.getElementById("dy-zoomout").addEventListener("click", () => zoomTo(scale * 0.75));

  document.getElementById("dy-locate").addEventListener("click", () => {
    // Find deepest unlocked/completed node with a real slug
    let best = null, bestDepth = -1;
    Object.values(nodeMap).forEach(node => {
      if (!node.slug || node.coming_soon) return;
      const st = figStatus(node);
      if (st === "locked") return;
      const idx = CHAPTER_SLUGS.indexOf(node.slug);
      if (idx > bestDepth) { bestDepth = idx; best = node; }
    });
    if (!best) return;
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    const newScale = 1.2;
    offsetX = vw / 2 - best._x * newScale;
    offsetY = vh / 2 - (best._y + NH / 2) * newScale;
    scale = newScale;
    canvas.style.transition = "transform .45s cubic-bezier(.4,0,.2,1)";
    applyTransform();
    setTimeout(() => { canvas.style.transition = ""; }, 500);
    try { navigator.vibrate?.(12); } catch {}
  });

  /* ── Filter tabs ──────────────────────────────────────────────────────── */
  function buildFilters(trees) {
    const container = document.getElementById("dy-filters");
    container.innerHTML = "";

    const tabs = [{ id: "all", label: t("dynasty_filter_all", "All") }]
      .concat(trees.map(t => ({ id: t.id, label: t.label })));

    tabs.forEach(tab => {
      const el = document.createElement("div");
      el.className = "dy-ftab" + (tab.id === activeFilter ? " active" : "");
      el.textContent = tab.label;
      el.addEventListener("click", () => {
        if (activeFilter === tab.id) return;
        activeFilter = tab.id;
        container.querySelectorAll(".dy-ftab").forEach(b => b.classList.remove("active"));
        el.classList.add("active");
        render(allTrees);
        // Snap to root of filtered tree
        const tree = tab.id === "all" ? allTrees[0] : allTrees.find(t => t.id === tab.id);
        if (tree) snapToNode(tree.root);
      });
      container.appendChild(el);
    });
  }

  function snapToNode(node) {
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    const newScale = Math.min(1.1, viewport.clientWidth / (subW(node) + PAD * 2));
    offsetX = vw / 2 - node._x * newScale;
    offsetY = 40;
    scale   = newScale;
    canvas.style.transition = "transform .4s cubic-bezier(.4,0,.2,1)";
    applyTransform();
    setTimeout(() => { canvas.style.transition = ""; }, 450);
  }

  /* ── Initial layout + camera ──────────────────────────────────────────── */
  function initCamera(trees) {
    if (!trees.length) return;
    const root = trees[0].root;
    // Fit all trees horizontally with some zoom-out
    let totalW = 0;
    trees.forEach((t, i) => { totalW += subW(t.root); if (i < trees.length-1) totalW += TGAP; });
    const fitScale = Math.min(1.0, (viewport.clientWidth * 0.88) / (totalW + PAD * 2));
    scale = Math.max(MIN_SCALE, fitScale);
    // Center horizontally
    const canvasW = parseFloat(canvas.style.width  || 0);
    offsetX = (viewport.clientWidth  - canvasW * scale) / 2;
    offsetY = 20;
    applyTransform();
  }

  /* ── Bootstrap ────────────────────────────────────────────────────────── */
  fetch("data/dynasty.json?v=2")
    .then(r => r.json())
    .then(data => {
      allTrees = data.trees;
      buildNodeMap(allTrees);
      buildFilters(allTrees);
      render(allTrees);
      initCamera(allTrees);
    })
    .catch(() => {
      canvas.innerHTML = `<div style="padding:40px;color:var(--muted);text-align:center">Failed to load dynasty data.</div>`;
    });

  /* ── Re-render on return ──────────────────────────────────────────────── */
  const rerender = () => {
    if (allTrees.length) {
      render(allTrees);
    }
  };
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") rerender(); });
  window.addEventListener("pageshow", rerender);
  window.addEventListener("shahnama:state_sync", rerender);
  window.addEventListener("balanceUpdate", rerender);

})();
</script>
</body>
</html>
