<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04050b" />
  <title>Mythic Lineage · REAL Shahnameh</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=202606060001" />
  <style>
    /* ── Page shell ──────────────────────────────────────────────────────── */
    .dynasty-page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      padding: 0;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    .dy-header {
      flex-shrink: 0;
      padding: 18px 16px 10px;
      text-align: center;
    }
    .dy-kicker {
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .dy-h1 {
      font-size: 22px;
      font-weight: 900;
      margin: 0 0 4px;
      background: linear-gradient(135deg, var(--gold-2) 0%, var(--gold) 60%, #e8a94f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Progress pill */
    .dy-progress {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 16px 0;
      background: rgba(244,197,107,.07);
      border: 1px solid rgba(244,197,107,.18);
      border-radius: 30px;
      padding: 7px 14px;
    }
    .dy-track {
      flex: 1; height: 3px;
      background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden;
    }
    .dy-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-3), var(--gold-2));
      border-radius: 2px;
      transition: width .7s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }
    .dy-label {
      font-size: 11px; font-weight: 700; color: var(--gold); white-space: nowrap;
    }

    /* ── Filter tabs ─────────────────────────────────────────────────────── */
    .dy-filters {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      padding: 10px 14px 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .dy-filters::-webkit-scrollbar { display: none; }
    .dy-ftab {
      flex-shrink: 0;
      font-size: 10.5px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: all .15s;
    }
    .dy-ftab.active {
      background: rgba(244,197,107,.14);
      border-color: rgba(244,197,107,.4);
      color: var(--gold);
    }

    /* ── Canvas viewport ─────────────────────────────────────────────────── */
    #dy-viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
      cursor: grab;
      touch-action: none;
    }
    #dy-viewport.dragging { cursor: grabbing; }
    #dy-canvas {
      position: absolute;
      top: 0; left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }
    #dy-svg {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      overflow: visible;
    }

    /* ── Tree nodes ──────────────────────────────────────────────────────── */
    .tn {
      position: absolute;
      text-align: center;
      user-select: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .2s;
    }
    .tn-ring {
      position: relative;
      margin: 0 auto;
      border-radius: 50%;
      overflow: hidden;
      border: 2.5px solid transparent;
      background: var(--bg-2);
      transition: box-shadow .2s, border-color .2s;
    }
    .tn-ring img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .tn-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(4,5,11,.55);
      font-size: 14px; border-radius: 50%;
    }
    .tn-sdot {
      width: 8px; height: 8px; border-radius: 50%;
      margin: 4px auto 0;
      background: rgba(255,255,255,.15);
    }
    .tn-name {
      font-size: 9.5px; font-weight: 700;
      color: var(--text); margin-top: 3px;
      line-height: 1.2;
      word-break: break-word;
    }
    .tn-sub {
      font-size: 7.5px; color: var(--muted-2);
      line-height: 1.2; margin-top: 1px;
      word-break: break-word;
    }
    .tn-note-badge {
      font-size: 6.5px;
      background: rgba(255,255,255,.07);
      border-radius: 6px;
      padding: 1px 5px;
      color: var(--muted-2);
      margin-top: 2px;
      display: inline-block;
      max-width: 78px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Type-specific ring colors ───────────────────────────────────────── */
    .tn-king .tn-ring      { border-color: rgba(244,197,107,.38); }
    .tn-hero .tn-ring      { border-color: rgba(140,109,255,.45); }
    .tn-prince .tn-ring    { border-color: rgba(78,208,166,.38); }
    .tn-villain .tn-ring   { border-color: rgba(255,82,103,.45); }
    .tn-adventure .tn-ring { border-color: rgba(78,208,166,.22); }
    .tn-mythic .tn-ring    { border-color: rgba(140,109,255,.5); border-style: dashed; }
    .tn-spouse .tn-ring    { border-color: rgba(190,190,210,.45); }

    /* ── Spouse node (smaller, softer) ──────────────────────────────────── */
    .tn-spouse-el { opacity: .88; }
    .tn-spouse-el .tn-name { color: rgba(255,255,255,.7); font-style: italic; }

    /* ── Status modifiers ────────────────────────────────────────────────── */
    .tn-completed .tn-ring { border-width: 3px; box-shadow: 0 0 16px rgba(244,197,107,.35); }
    .tn-completed.tn-king .tn-ring    { border-color: var(--gold); }
    .tn-completed.tn-hero .tn-ring    { border-color: var(--violet); box-shadow: 0 0 14px rgba(140,109,255,.4); }
    .tn-completed.tn-prince .tn-ring  { border-color: #4ed0a6; box-shadow: 0 0 12px rgba(78,208,166,.35); }
    .tn-completed.tn-villain .tn-ring { border-color: #ff5267; box-shadow: 0 0 12px rgba(255,82,103,.3); }
    .tn-completed .tn-sdot { background: #4ed0a6; }

    .tn-unlocked .tn-sdot { background: var(--gold); }

    .tn-locked { opacity: .55; cursor: pointer; }
    .tn-locked .tn-ring {
      filter: grayscale(1) brightness(.42);
      border-color: rgba(255,255,255,.1) !important;
      box-shadow: none !important;
    }
    .tn-locked .tn-name { color: rgba(255,255,255,.4); }

    .tn-coming_soon { opacity: .45; cursor: default; }
    .tn-coming_soon .tn-ring { filter: grayscale(.8) brightness(.45); }

    .tn-story_only .tn-ring  { border-color: rgba(255,255,255,.2); border-style: dashed; }
    .tn-story_only .tn-sdot  { background: rgba(255,255,255,.18); }
    .tn-story_only .tn-name  { color: rgba(255,255,255,.5); font-style: italic; }

    /* ── Legend ──────────────────────────────────────────────────────────── */
    .dy-legend {
      position: absolute;
      bottom: 12px; left: 12px;
      display: flex; flex-wrap: wrap; gap: 8px 14px;
      z-index: 10;
      background: rgba(8,10,26,.75);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px;
      padding: 7px 10px;
      pointer-events: none;
    }
    .dy-leg-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 9px; color: rgba(255,255,255,.45); font-weight: 600;
      white-space: nowrap;
    }
    .dy-leg-swatch {
      display: inline-block; width: 20px; height: 2px; border-radius: 1px;
    }
    .dy-leg-swatch.gold   { background: rgba(244,197,107,.7); }
    .dy-leg-swatch.silver { background: none; border-top: 1.5px dashed rgba(190,190,210,.55); height:0; }
    .dy-leg-swatch.red    { background: none; border-top: 1.5px dashed rgba(255,82,103,.7); height:0; }
    .dy-leg-swatch.teal   { background: none; border-top: 1.5px dashed rgba(78,208,166,.6); height:0; }
    .dy-leg-swatch.violet { background: none; border-top: 1px dotted rgba(140,109,255,.5); height:0; }

    /* ── Lore card modal (story-only characters) ─────────────────────────── */
    .lore-backdrop {
      position: fixed; inset: 0; z-index: 1200;
      background: rgba(0,0,0,.72);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      opacity: 0; pointer-events: none;
      transition: opacity .2s ease;
    }
    .lore-backdrop.open { opacity: 1; pointer-events: all; }
    .lore-modal {
      background: var(--surface, #1a1b2e);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 18px;
      padding: 28px 22px 24px;
      max-width: 310px; width: 100%;
      text-align: center;
      transform: translateY(12px);
      transition: transform .2s ease;
      position: relative;
    }
    .lore-backdrop.open .lore-modal { transform: translateY(0); }
    .lore-close {
      position: absolute; top: 12px; right: 14px;
      background: none; border: none; color: rgba(255,255,255,.45);
      font-size: 18px; cursor: pointer; padding: 4px 8px; line-height: 1;
    }
    .lore-ring {
      width: 70px; height: 70px; border-radius: 50%;
      border: 2px dashed rgba(255,255,255,.3);
      margin: 0 auto 14px;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.04);
    }
    .lore-ring img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .lore-ring .lore-ring-fallback { font-size: 28px; }
    .lore-name { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .lore-title { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(255,255,255,.45); margin-bottom: 14px; }
    .lore-desc { font-size: 13px; line-height: 1.65; color: rgba(255,255,255,.75); text-align: left; margin-bottom: 18px; }
    .lore-badge {
      display: inline-block; padding: 4px 12px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 20px;
      font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
      color: rgba(255,255,255,.4);
    }

    /* ── Tree section label ──────────────────────────────────────────────── */
    .dy-tree-label {
      position: absolute;
      font-size: 8.5px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: rgba(244,197,107,.5);
      font-weight: 800;
      white-space: nowrap;
      pointer-events: none;
    }

    /* ── World milestone chips ───────────────────────────────────────────── */
    .dy-milestone-strip {
      position: absolute;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      pointer-events: none;
    }
    .dy-milestone-chip {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 8px;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: .3px;
    }
    .dy-milestone-chip.cat-world  { background: rgba(80,120,200,.18); border: 1px solid rgba(80,120,200,.35); color: rgba(140,180,255,.85); }
    .dy-milestone-chip.cat-persia { background: rgba(244,197,107,.12); border: 1px solid rgba(244,197,107,.35); color: rgba(244,197,107,.9); }
    .dy-milestone-chip.cat-faith  { background: rgba(74,208,166,.12); border: 1px solid rgba(74,208,166,.35); color: rgba(74,208,166,.9); }
    .dy-milestone-chip .ms-year   { opacity: .65; }

    /* ── FABs ────────────────────────────────────────────────────────────── */
    .dy-fabs {
      position: absolute;
      bottom: 16px; right: 16px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 10;
    }
    .dy-fab {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(14,19,42,.92);
      border: 1px solid rgba(244,197,107,.3);
      color: var(--gold);
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 16px rgba(0,0,0,.5);
    }
    .dy-fab:active { opacity: .7; }
  </style>
</head>

<script>
(() => {
  "use strict";

  /* ── i18n helper ──────────────────────────────────────────────────────── */
  const t = (key, fb) => {
    try {
      const l = localStorage.getItem("real_lang") || "en";
      const loc = window.RealI18NLocales;
      return (loc && loc[l] && loc[l][key]) || (loc && loc.en && loc.en[key]) || fb || key;
    } catch { return fb || key; }
  };

  /* ── Toast ────────────────────────────────────────────────────────────── */
  const toastEl = document.querySelector("[data-toast]");
  const toast = (msg) => {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove("show"), 2400);
  };

  /* ── Chapter progress ─────────────────────────────────────────────────── */
  const CHAPTER_SLUGS = [
    "keyumars","hushang","tahmuras","jamshid","zahhak",
    "fereydun","manuchehr","nozar","zal","rudabeh",
    "birth-of-rostam","rostam","sohrab","simorgh","akvan",
    "seven-labours-esp","siavash","kay-kavus","kay-khosrow",
    "bijan-manijeh","great-war-turan","lohrasp",
    "goshtasp","esfandiyar","clash-rostam-esp","rostams-end",
    "memory-over-sword","bahman","homay","darab","dara",
    "alexander","mourning-pars","ashkanian-age","ardavan",
    "ardeshir","shapur","yazdegerd-sinner","bahram-gur","anushirvan",
    "nushzad","hormuz","bahram-chubin","khosrow-parviz","shirin",
    "yazdegerd-iii","arab-conquest","ages-end","ferdowsi-legacy",
  ];

  const isDone = (slug) => {
    try { return localStorage.getItem("real_chapter_done_" + slug) === "1"; } catch { return false; }
  };

  const figStatus = (node) => {
    if (node.coming_soon) return "coming_soon";
    const slug = node.slug;
    if (!slug) return "story_only";
    if (isDone(slug)) return "completed";
    const idx = CHAPTER_SLUGS.indexOf(slug);
    if (idx < 0) return "locked";
    if (idx <= 1) return "unlocked";
    if (isDone(CHAPTER_SLUGS[idx - 1])) return "unlocked";
    return "locked";
  };

  /* ── Layout constants ─────────────────────────────────────────────────── */
  const NW    = 80;   // main node slot width
  const NH    = 110;  // main node slot height
  const SW    = 54;   // spouse node slot width
  const SH    = 86;   // spouse node slot height
  const AW    = 54;   // adventure node slot width
  const AH    = 80;   // adventure node slot height
  const RING  = 64;   // main ring diameter
  const SRING = 42;   // spouse ring diameter
  const ARING = 40;   // adventure ring diameter
  const HGAP  = 16;   // horizontal gap between sibling subtrees
  const SGAP  = 14;   // gap between main node right edge and spouse left edge
  const VGAP  = 50;   // vertical gap parent→child
  const TGAP  = 100;  // gap between separate trees
  const PAD   = 70;   // canvas padding

  const IMG = "/season2/uploads/";

  /* ── Node dimensions ─────────────────────────────────────────────────── */
  const nw    = n => n._isSpouse ? SW : n.type === "adventure" ? AW : NW;
  const nh    = n => n._isSpouse ? SH : n.type === "adventure" ? AH : NH;
  const nring = n => n._isSpouse ? SRING : n.type === "adventure" ? ARING : RING;

  /* ── Classify children ───────────────────────────────────────────────── */
  const isSpouseChild = n => n.relation === "spouse" || n.type === "spouse";

  function bloodKids(node) {
    return (node.children || []).filter(c => !isSpouseChild(c));
  }

  /* ── Spouse slot width ───────────────────────────────────────────────── */
  function spouseW(node) {
    const sps = node.spouses || [];
    return sps.length ? sps.length * (SW + SGAP) : 0;
  }

  /* ── Subtree width ───────────────────────────────────────────────────── */
  function subW(node) {
    const ownW = nw(node) + spouseW(node);
    const bc   = bloodKids(node);
    if (!bc.length) return ownW;
    const childSum = bc.reduce((s, c) => s + subW(c), 0) + (bc.length - 1) * HGAP;
    return Math.max(ownW, childSum);
  }

  /* ── Assign positions ────────────────────────────────────────────────── */
  function assignPos(node, cx, y) {
    const spW = spouseW(node);
    node._x = cx - spW / 2;
    node._y = y;

    // Position spouses to the right of this node
    (node.spouses || []).forEach((sp, i) => {
      sp._isSpouse = true;
      sp._x = node._x + NW / 2 + SGAP + SW / 2 + i * (SW + SGAP);
      sp._y = y + (RING - SRING) / 2;
    });

    // Position blood children centered below this node
    const bc = bloodKids(node);
    if (!bc.length) return;
    const totalW = bc.reduce((s, c) => s + subW(c), 0) + (bc.length - 1) * HGAP;
    let lx = node._x - totalW / 2;
    bc.forEach(child => {
      const cw = subW(child);
      assignPos(child, lx + cw / 2, y + nh(node) + VGAP);
      lx += cw + HGAP;
    });
  }

  /* ── Collect all renderable nodes ────────────────────────────────────── */
  function collectNodes(node, arr = []) {
    arr.push(node);
    bloodKids(node).forEach(c => collectNodes(c, arr));
    return arr;
  }

  function collectSpousePairs(node, arr = []) {
    (node.spouses || []).forEach(sp => arr.push({ node, sp }));
    bloodKids(node).forEach(c => collectSpousePairs(c, arr));
    return arr;
  }

  /* ── State ───────────────────────────────────────────────────────────── */
  let allTrees = [];
  let standaloneNodes = {};
  let activeFilter = "all";
  let scale = 1.0;
  let offsetX = 0;
  let offsetY = 0;

  const viewport = document.getElementById("dy-viewport");
  const canvas   = document.getElementById("dy-canvas");
  const svg      = document.getElementById("dy-svg");
  const dyFill   = document.getElementById("dy-fill");
  const dyLabel  = document.getElementById("dy-label");

  /* ── Apply transform ─────────────────────────────────────────────────── */
  const applyTransform = () => {
    canvas.style.transform = `translate(${offsetX}px,${offsetY}px) scale(${scale})`;
  };

  /* ── SVG path helper ─────────────────────────────────────────────────── */
  function mkPath(d, stroke, width, dash) {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d);
    p.setAttribute("stroke", stroke);
    p.setAttribute("stroke-width", String(width));
    p.setAttribute("fill", "none");
    p.setAttribute("stroke-linecap", "round");
    if (dash) p.setAttribute("stroke-dasharray", dash);
    svg.appendChild(p);
  }

  /* ── Blood / succession edge ─────────────────────────────────────────── */
  function drawEdge(parent, child) {
    const x1 = parent._x + nw(parent) / 2;
    const y1 = parent._y + nring(parent) + (nh(parent) - nring(parent)) / 2;
    const x2 = child._x + nw(child) / 2;
    const y2 = child._y + (nh(child) - nring(child)) / 2;
    const my = (y1 + y2) / 2;
    const d  = `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`;

    const rel = child.relation || "blood";
    let stroke = "rgba(244,197,107,0.30)";
    let dash = "", width = 2;

    if      (rel === "blood" || rel === "daughter") { stroke = "rgba(244,197,107,0.35)"; }
    else if (rel === "usurper")    { stroke = "rgba(255,82,103,0.55)";  dash = "7,4";  width = 1.5; }
    else if (rel === "liberator")  { stroke = "rgba(78,208,166,0.55)";  dash = "8,4";  width = 1.5; }
    else if (rel === "chosen")     { stroke = "rgba(244,197,107,0.5)";  dash = "6,5";  width = 1.5; }
    else if (rel === "companion")  { stroke = "rgba(140,109,255,0.4)";  dash = "4,4";  width = 1.5; }
    else if (rel === "rival")      { stroke = "rgba(255,82,103,0.4)";   dash = "5,4";  width = 1.5; }
    else if (rel === "descendant") { stroke = "rgba(244,197,107,0.22)"; dash = "3,6";  width = 1.5; }
    else if (rel === "mentor")     { stroke = "rgba(140,109,255,0.35)"; dash = "3,5";  width = 1; }
    else if (rel === "event" || child.type === "adventure") { stroke = "rgba(78,208,166,0.2)"; dash = "2,5"; width = 1; }

    mkPath(d, stroke, width, dash);
  }

  /* ── Horizontal spouse line ──────────────────────────────────────────── */
  function drawSpouseLine(mainNode, sp) {
    const x1 = mainNode._x + NW / 2 + RING / 2 + 2;
    const x2 = sp._x - SRING / 2 - 2;
    const y  = mainNode._y + (RING - SRING) / 2 + SRING / 2;
    const d  = `M ${x1} ${y} L ${x2} ${y}`;
    const isRival   = sp.relation_type === "rival";
    const isSpecial = sp.relation_type === "special";
    const stroke = isRival   ? "rgba(255,82,103,0.55)"
                 : isSpecial ? "rgba(255,210,60,0.7)"
                 :              "rgba(190,190,210,0.5)";
    const dash = isRival ? "6,4" : isSpecial ? "3,4" : "5,3";
    mkPath(d, stroke, 1.5, dash);
  }

  /* ── Render ──────────────────────────────────────────────────────────── */
  function render(trees) {
    canvas.querySelectorAll(".tn,.dy-tree-label").forEach(e => e.remove());
    svg.innerHTML = "";

    let curX = PAD;
    const toRender = activeFilter === "all"
      ? trees
      : trees.filter(t => t.id === activeFilter);

    toRender.forEach(tree => {
      const w = subW(tree.root);
      assignPos(tree.root, curX + w / 2, PAD + 24);

      const lbl = document.createElement("div");
      lbl.className = "dy-tree-label";
      lbl.textContent = tree.label;
      lbl.style.left = curX + "px";
      lbl.style.top  = "6px";
      canvas.appendChild(lbl);

      /* World milestone chips — positioned below tree label */
      const events = tree.world_events || [];
      if (events.length) {
        const strip = document.createElement("div");
        strip.className = "dy-milestone-strip";
        strip.style.left  = curX + "px";
        strip.style.top   = "22px";
        strip.style.width = w + "px";
        events.forEach(ev => {
          const chip = document.createElement("div");
          chip.className = `dy-milestone-chip cat-${ev.cat || "world"}`;
          chip.innerHTML = `<span class="ms-year">${ev.year}</span><span>${ev.label}</span>`;
          strip.appendChild(chip);
        });
        canvas.appendChild(strip);
      }

      curX += w + TGAP;
    });

    const allNodes   = toRender.flatMap(t => collectNodes(t.root));
    const spousePairs = toRender.flatMap(t => collectSpousePairs(t.root));

    // Canvas size
    let maxX = 0, maxY = 0;
    allNodes.forEach(n => { maxX = Math.max(maxX, n._x + NW); maxY = Math.max(maxY, n._y + NH); });
    spousePairs.forEach(({sp}) => { if (sp._x) { maxX = Math.max(maxX, sp._x + SW); } });
    maxX += PAD; maxY += PAD;

    canvas.style.width  = maxX + "px";
    canvas.style.height = maxY + "px";
    svg.setAttribute("width",  maxX);
    svg.setAttribute("height", maxY);

    // 1. Blood/succession edges
    allNodes.forEach(node => {
      bloodKids(node).forEach(child => drawEdge(node, child));
    });

    // 2. Spouse lines
    spousePairs.forEach(({node, sp}) => {
      if (sp._x != null) drawSpouseLine(node, sp);
    });

    // 3. Main nodes
    let total = 0, found = 0;
    allNodes.forEach(node => {
      const st = figStatus(node);
      if (node.slug && node.type !== "adventure") {
        total++;
        if (st !== "locked" && st !== "coming_soon") found++;
      }
      canvas.appendChild(makeNodeEl(node, st, false));
    });

    // 4. Spouse nodes
    spousePairs.forEach(({sp}) => {
      if (sp._x == null) return;
      const st = sp.slug ? figStatus(sp) : "story_only";
      canvas.appendChild(makeNodeEl(sp, st, true));
    });

    const pct = total > 0 ? Math.round(found / total * 100) : 0;
    dyFill.style.width  = pct + "%";
    dyLabel.textContent = `${found} / ${total} ${t("dynasty_discovered","discovered")}`;
  }

  /* ── Build node DOM element ──────────────────────────────────────────── */
  function makeNodeEl(node, status, isSpouseEl) {
    const ring   = nring(node);
    const nwSlot = nw(node);
    const left   = node._x - nwSlot / 2;

    const typeClass = isSpouseEl          ? "tn-spouse"
      : node.type === "mythic"            ? "tn-mythic"
      : node.type === "villain"           ? "tn-villain"
      : node.type === "hero"              ? "tn-hero"
      : node.type === "prince"            ? "tn-prince"
      : node.type === "adventure"         ? "tn-adventure"
      : "tn-king";

    const el = document.createElement("div");
    el.className = `tn ${typeClass} tn-${status}${isSpouseEl ? " tn-spouse-el" : ""}`;
    el.style.cssText = `left:${left}px;top:${node._y}px;width:${nwSlot}px`;
    el.setAttribute("data-node-id", node.id);

    const imgSrc = node.img && node.img.startsWith("/")
      ? node.img
      : IMG + (node.img || "");

    const storyOnly = !node.slug || status === "story_only";
    const dashRing  = storyOnly ? "border-style:dashed;" : "";

    const overlayHTML = status === "coming_soon"
      ? `<div class="tn-overlay">⏳</div>` : "";

    const dotHTML = (!storyOnly && status !== "locked" && status !== "coming_soon")
      ? `<div class="tn-sdot"></div>` : "";

    const nameText = node.name;
    const subText  = (!isSpouseEl && status !== "locked") ? (node.title || "") : "";

    el.innerHTML = `
      <div class="tn-ring" style="width:${ring}px;height:${ring}px;${dashRing}">
        <img src="${imgSrc}" alt="${nameText}" loading="lazy" draggable="false"
             onerror="this.style.display='none'">
        ${overlayHTML}
      </div>
      ${dotHTML}
      <div class="tn-name"${isSpouseEl ? ' style="font-size:8.5px"' : ""}>${nameText}</div>
      ${subText ? `<div class="tn-sub">${subText}</div>` : ""}
    `;

    return el;
  }

  /* ── Node tap handler ─────────────────────────────────────────────────── */
  const nodeMap = {};
  function buildNodeMap(trees, standalone) {
    trees.forEach(t => collectNodes(t.root).forEach(n => { nodeMap[n.id] = n; }));
    // Also register spouse nodes from spouses[] arrays
    trees.forEach(t => collectSpousePairs(t.root).forEach(({sp}) => { nodeMap[sp.id] = sp; }));
    // Register standalone nodes
    Object.values(standalone || {}).forEach(n => { nodeMap[n.id] = n; });
  }

  function handleNodeTap(nodeId) {
    const node = nodeMap[nodeId];
    if (!node) return;
    const st = node._isSpouse ? (node.slug ? figStatus(node) : "story_only") : figStatus(node);
    try { navigator.vibrate?.(8); } catch {}

    if (st === "coming_soon") {
      toast(t("dynasty_coming_soon", "Coming soon — this chapter is in the works"));
      return;
    }
    // Spouse nodes and story-only always open lore modal
    if (node._isSpouse || st === "story_only" || !node.slug) {
      openLoreModal(node);
      return;
    }
    if (st === "locked") {
      const idx = CHAPTER_SLUGS.indexOf(node.slug);
      const msg = idx >= 0
        ? t("dynasty_locked_ch_toast", "Complete chapter {n} to unlock").replace("{n}", idx)
        : t("dynasty_locked_toast", "This character is not yet unlocked");
      toast(msg);
      return;
    }
    window.location.href = "chapter.html?slug=" + encodeURIComponent(node.slug);
  }

  /* ── Lore card modal ─────────────────────────────────────────────────── */
  const loreBackdrop = document.getElementById("lore-backdrop");
  const loreRing     = document.getElementById("lore-ring");
  const loreName     = document.getElementById("lore-name");
  const loreTitle    = document.getElementById("lore-title");
  const loreDesc     = document.getElementById("lore-desc");
  const loreBadge    = document.getElementById("lore-badge");

  function openLoreModal(node) {
    const lore = node.lore || {};
    // Ring image
    const imgSrc = node.img
      ? (node.img.startsWith('/') ? node.img : IMG + node.img)
      : null;
    loreRing.innerHTML = imgSrc
      ? `<img src="${imgSrc}" alt="${node.name}" onerror="this.outerHTML='<span class=\'lore-ring-fallback\'>👤</span>'">`
      : `<span class="lore-ring-fallback">👤</span>`;
    loreName.textContent  = node.name || "";
    loreTitle.textContent = lore.title || node.title || "";
    loreDesc.textContent  = lore.description || "";
    loreBadge.textContent = lore.badge || "Story Character";
    loreBackdrop.classList.add("open");
    document.getElementById("lore-close").focus();
  }

  function closeLoreModal() {
    loreBackdrop.classList.remove("open");
  }

  document.getElementById("lore-close").addEventListener("click", closeLoreModal);
  loreBackdrop.addEventListener("click", e => { if (e.target === loreBackdrop) closeLoreModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeLoreModal(); });

  /* ── Pan / zoom ───────────────────────────────────────────────────────── */
  let dragging = false, tapCancelled = false;
  let lastX = 0, lastY = 0, tapSX = 0, tapSY = 0, tapT = 0;
  let startDist = 0, startScale = 1, startOX = 0, startOY = 0;

  const MIN_SCALE = 0.22, MAX_SCALE = 2.8;

  const zoomTo = (newScale, pivotX, pivotY) => {
    const clamped = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
    const rect = viewport.getBoundingClientRect();
    const px = (pivotX !== undefined ? pivotX : rect.width  / 2) ;
    const py = (pivotY !== undefined ? pivotY : rect.height / 2);
    offsetX = px - (px - offsetX) * (clamped / scale);
    offsetY = py - (py - offsetY) * (clamped / scale);
    scale = clamped;
    applyTransform();
  };

  const clampOffset = () => {
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    const cw = parseFloat(canvas.style.width  || 0) * scale;
    const ch = parseFloat(canvas.style.height || 0) * scale;
    const minX = Math.min(0, vw - cw - PAD * scale);
    const minY = Math.min(0, vh - ch - PAD * scale);
    offsetX = Math.min(PAD * scale, Math.max(minX, offsetX));
    offsetY = Math.min(PAD * scale, Math.max(minY, offsetY));
  };

  viewport.addEventListener("touchstart", e => {
    if (e.touches.length === 1) {
      dragging = true; tapCancelled = false;
      lastX = tapSX = e.touches[0].clientX;
      lastY = tapSY = e.touches[0].clientY;
      tapT = Date.now();
    } else if (e.touches.length === 2) {
      dragging = false; tapCancelled = true;
      startDist = Math.hypot(
        e.touches[1].clientX - e.touches[0].clientX,
        e.touches[1].clientY - e.touches[0].clientY
      );
      startScale = scale;
      startOX = offsetX; startOY = offsetY;
    }
  }, { passive: true });

  viewport.addEventListener("touchmove", e => {
    e.preventDefault();
    if (e.touches.length === 1 && dragging) {
      const dx = e.touches[0].clientX - lastX;
      const dy = e.touches[0].clientY - lastY;
      if (Math.hypot(dx, dy) > 5) tapCancelled = true;
      offsetX += dx; offsetY += dy;
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      applyTransform();
    } else if (e.touches.length === 2) {
      const dist = Math.hypot(
        e.touches[1].clientX - e.touches[0].clientX,
        e.touches[1].clientY - e.touches[0].clientY
      );
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const rect = viewport.getBoundingClientRect();
      zoomTo(startScale * (dist / startDist), mx - rect.left, my - rect.top);
    }
  }, { passive: false });

  viewport.addEventListener("touchend", e => {
    if (!tapCancelled && e.changedTouches.length === 1 && Date.now() - tapT < 380) {
      const cx = e.changedTouches[0].clientX;
      const cy = e.changedTouches[0].clientY;
      if (Math.hypot(cx - tapSX, cy - tapSY) < 14) {
        const el = document.elementFromPoint(cx, cy)?.closest("[data-node-id]");
        if (el) handleNodeTap(el.dataset.nodeId);
      }
    }
    dragging = false;
  }, { passive: true });

  /* mouse support */
  viewport.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    dragging = true; tapCancelled = false;
    lastX = tapSX = e.clientX; lastY = tapSY = e.clientY;
    tapT = Date.now();
    viewport.classList.add("dragging");
    e.preventDefault();
  });
  document.addEventListener("mousemove", e => {
    if (!dragging) return;
    const dx = e.clientX - lastX; const dy = e.clientY - lastY;
    if (Math.hypot(dx, dy) > 5) tapCancelled = true;
    offsetX += dx; offsetY += dy;
    lastX = e.clientX; lastY = e.clientY;
    applyTransform();
  });
  document.addEventListener("mouseup", e => {
    if (!tapCancelled && dragging && e.button === 0 && Date.now() - tapT < 380) {
      if (Math.hypot(e.clientX - tapSX, e.clientY - tapSY) < 10) {
        const el = document.elementFromPoint(e.clientX, e.clientY)?.closest("[data-node-id]");
        if (el) handleNodeTap(el.dataset.nodeId);
      }
    }
    dragging = false;
    viewport.classList.remove("dragging");
  });
  viewport.addEventListener("wheel", e => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    zoomTo(scale * factor, e.clientX - rect.left, e.clientY - rect.top);
  }, { passive: false });

  /* ── FAB buttons ──────────────────────────────────────────────────────── */
  document.getElementById("dy-zoomin").addEventListener("click", () => zoomTo(scale * 1.3));
  document.getElementById("dy-zoomout").addEventListener("click", () => zoomTo(scale * 0.75));

  document.getElementById("dy-locate").addEventListener("click", () => {
    // Find deepest unlocked/completed node with a real slug
    let best = null, bestDepth = -1;
    Object.values(nodeMap).forEach(node => {
      if (!node.slug || node.coming_soon) return;
      const st = figStatus(node);
      if (st === "locked") return;
      const idx = CHAPTER_SLUGS.indexOf(node.slug);
      if (idx > bestDepth) { bestDepth = idx; best = node; }
    });
    if (!best) return;
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    const newScale = 1.2;
    offsetX = vw / 2 - best._x * newScale;
    offsetY = vh / 2 - (best._y + NH / 2) * newScale;
    scale = newScale;
    canvas.style.transition = "transform .45s cubic-bezier(.4,0,.2,1)";
    applyTransform();
    setTimeout(() => { canvas.style.transition = ""; }, 500);
    try { navigator.vibrate?.(12); } catch {}
  });

  /* ── Filter tabs ──────────────────────────────────────────────────────── */
  function buildFilters(trees) {
    const container = document.getElementById("dy-filters");
    container.innerHTML = "";

    const tabs = [{ id: "all", label: t("dynasty_filter_all", "All") }]
      .concat(trees.map(t => ({ id: t.id, label: t.label })));

    tabs.forEach(tab => {
      const el = document.createElement("div");
      el.className = "dy-ftab" + (tab.id === activeFilter ? " active" : "");
      el.textContent = tab.label;
      el.addEventListener("click", () => {
        if (activeFilter === tab.id) return;
        activeFilter = tab.id;
        container.querySelectorAll(".dy-ftab").forEach(b => b.classList.remove("active"));
        el.classList.add("active");
        render(allTrees);
        // Snap to root of filtered tree
        const tree = tab.id === "all" ? allTrees[0] : allTrees.find(t => t.id === tab.id);
        if (tree) snapToNode(tree.root);
      });
      container.appendChild(el);
    });
  }

  function snapToNode(node) {
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    const newScale = Math.min(1.1, viewport.clientWidth / (subW(node) + PAD * 2));
    offsetX = vw / 2 - node._x * newScale;
    offsetY = 40;
    scale   = newScale;
    canvas.style.transition = "transform .4s cubic-bezier(.4,0,.2,1)";
    applyTransform();
    setTimeout(() => { canvas.style.transition = ""; }, 450);
  }

  /* ── Initial layout + camera ──────────────────────────────────────────── */
  function initCamera(trees) {
    if (!trees.length) return;
    const root = trees[0].root;
    // Fit all trees horizontally with some zoom-out
    let totalW = 0;
    trees.forEach((t, i) => { totalW += subW(t.root); if (i < trees.length-1) totalW += TGAP; });
    const fitScale = Math.min(1.0, (viewport.clientWidth * 0.88) / (totalW + PAD * 2));
    scale = Math.max(MIN_SCALE, fitScale);
    // Center horizontally
    const canvasW = parseFloat(canvas.style.width  || 0);
    offsetX = (viewport.clientWidth  - canvasW * scale) / 2;
    offsetY = 20;
    applyTransform();
  }

  /* ── Bootstrap ────────────────────────────────────────────────────────── */
  fetch("data/dynasty.json?v=6")
    .then(r => r.json())
    .then(data => {
      allTrees       = data.trees;
      standaloneNodes = data.standalone_nodes || {};
      buildNodeMap(allTrees, standaloneNodes);
      buildFilters(allTrees);
      render(allTrees);
      initCamera(allTrees);
    })
    .catch(() => {
      canvas.innerHTML = `<div style="padding:40px;color:var(--muted);text-align:center">Failed to load dynasty data.</div>`;
    });

  /* ── Re-render on return ──────────────────────────────────────────────── */
  const rerender = () => {
    if (allTrees.length) {
      render(allTrees);
    }
  };
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") rerender(); });
  window.addEventListener("pageshow", rerender);
  window.addEventListener("shahnama:state_sync", rerender);
  window.addEventListener("balanceUpdate", rerender);

})();
</script>
</body>
</html>
