<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04050b" />
  <title>REAL Shahnameh — Profile</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=202605303400" />
</head>
<body>
  <main class="app">

    <section class="page-head">
      <button class="back-btn" id="back-btn" onclick="history.length > 1 ? history.back() : location.href='index.html'" aria-label="Back" data-i18n="profile_back">
        ← Back
      </button>
    </section>

    <section class="page-head" style="margin-top:0;">
      <div>
        <h2 class="page-title" data-i18n="profile_title">Chronicle</h2>
        <p class="page-sub" data-i18n="profile_sub">Your legend unfolds</p>
      </div>
      <span class="pill" id="path-pill" style="display:none;"></span>
    </section>

    <!-- Identity card -->
    <article class="card" id="profile-card" style="padding:18px;">
      <div class="profile-header">
        <div class="profile-avatar" id="profile-avatar">?</div>
        <div class="profile-identity">
          <div class="profile-name-row">
            <div class="profile-name" id="profile-name">Loading…</div>
            <span class="trustai-badge" id="trustai-badge" style="display:none;" title="TrustAI Verified Human">🛡 TrustAI</span>
          </div>
          <div class="profile-username" id="profile-username"></div>
          <div class="profile-path-tag" id="profile-path-tag" style="display:none;"></div>
          <div class="profile-inviter" id="profile-inviter" style="display:none;margin-top:5px;font-size:11px;color:var(--muted,#6c7287);"></div>
        </div>
      </div>
    </article>

    <!-- Clan Invites Inbox (hidden until populated) -->
    <div id="clan-invites-section" style="display:none;">
      <div class="section-head" style="margin-top:12px;">
        <h3>⚔ Clan Invites</h3>
        <span class="more" id="clan-invites-count"></span>
      </div>
      <div id="clan-invites-list"></div>
    </div>

    <!-- REAL Balance Card -->
    <article class="card real-balance-card" id="real-balance-card">
      <div class="rbc-glow"></div>
      <div class="rbc-left">
        <div class="rbc-label" data-i18n="rbc_label">REAL Balance</div>
        <div class="rbc-amount" id="rbc-amount">—</div>
        <div class="rbc-clan-bonus" id="rbc-clan-bonus" style="display:none;" data-i18n="rbc_clan_bonus">+5% Clan Bonus Active</div>
      </div>
      <img class="rbc-token" src="/assets/images/tokens/realtoken.png" alt="REAL" onerror="this.style.display='none'" />
    </article>

    <!-- Earnings Meter -->
    <div class="section-head" style="margin-top:4px;"><h3 data-i18n="em_title">Earnings Meter</h3></div>
    <article class="card earnings-meter-card">
      <div class="em-row">
        <div class="em-label" data-i18n="em_total_zar_lbl">Total ZAR Mined</div>
        <div class="em-live-val" id="em-zar-live">—</div>
      </div>
      <div class="em-divider"></div>
      <div class="em-row">
        <div class="em-sub-col">
          <div class="em-label" data-i18n="em_rate_min_lbl">Rate / Min</div>
          <div class="em-sub-val" id="em-rate-min">—</div>
        </div>
        <div class="em-sub-col">
          <div class="em-label" data-i18n="em_rate_hr_lbl">Rate / Hr</div>
          <div class="em-sub-val" id="em-rate-hr">—</div>
        </div>
        <div class="em-sub-col">
          <div class="em-label" data-i18n="em_next_payout_lbl">Next Payout</div>
          <div class="em-sub-val" id="em-payout">—</div>
        </div>
      </div>
    </article>

    <!-- Season stats -->
    <div class="section-head" style="margin-top:4px;"><h3 data-i18n="profile_stats">Season Stats</h3></div>
    <div class="stats-grid" id="stats-grid">
      <!-- populated by profile.js -->
    </div>

    <!-- Clan -->
    <div class="section-head" style="margin-top:18px;">
      <h3 id="clan-section-head" data-i18n="your_clan_header">Your Clan</h3>
    </div>
    <article id="profile-clan-card" class="card clan-cta-card">
      <!-- populated by profile.js renderClan() -->
      <div style="color:var(--muted);font-size:12px;padding:8px 0;">Loading…</div>
    </article>

    <!-- Achievements -->
    <div class="section-head" style="margin-top:18px;"><h3 data-i18n="profile_achievements">Achievements</h3></div>
    <div class="badge-grid" id="badge-grid">
      <!-- populated by profile.js -->
    </div>

  </main>

  <nav class="bottom-nav">
    <a class="nav-item" href="index.html"><span class="ni-ico">🏠</span><span data-i18n="home">Home</span></a>
    <a class="nav-item" href="tap.html"><span class="ni-ico">⚡</span><span data-i18n="tap">Tap</span></a>
    <a class="nav-item" href="heroes.html"><span class="ni-ico">⚔</span><span data-i18n="heroes">Heroes</span></a>
    <a class="nav-item" href="learn.html"><span class="ni-ico">📜</span><span data-i18n="learn">Learn</span></a>
    <a class="nav-item" href="earn.html"><span class="ni-ico">💎</span><span data-i18n="earn">Earn</span></a>
    <a class="nav-item" href="social.html"><span class="ni-ico">👥</span><span data-i18n="social">Social</span></a>
  </nav>

  <div class="toast" data-toast></div>
  <script src="app.js?v=202605302600"></script>
  <script src="i18n/en.js?v=202605303200"></script>
  <script src="i18n/fa.js?v=202605303200"></script>
  <script src="i18n/tg.js?v=202605303200"></script>
  <script src="i18n.js?v=202605272200"></script>
  <script src="resources.js?v=202605302400"></script>
  <script src="utils.js?v=202605262100"></script>
  <script src="audio.js?v=202605272200"></script>
  <script src="sync.js?v=202605302200"></script>
  <script src="profile.js?v=202605303300"></script>
</body>
</html>
